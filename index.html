<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>BEYBLADE X 大会管理</title>
  
  <!-- 画像のファイル名（PNGの大文字）をGitHub上のデータと完全に一致させます -->
  <link rel="apple-touch-icon" sizes="180x180" href="icon.PNG">
  <link rel="icon" type="image/png" sizes="192x192" href="icon.PNG">
  
  <!-- iOSでホーム画面から開いたときに全画面表示にする設定（必須） -->
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script>
    window.onload = function() {
      // 転送先のGASのURL
      const gasUrl = "https://script.google.com/macros/s/AKfycbyfbzP4zrii7Nwc4YCbEko7PG5Lf2NgaAgVzvQDMSG-YiRn6DjkxKj6seUwLsQ-siJE/exec";

      // iPhone等のホーム画面のアイコンから起動されたかを判定
      if (window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches) {
        // ホーム画面から開いた場合は、自動的にGASへ転送する
        window.location.href = gasUrl;
      } else {
        // Safariなどで普通に開いた場合は転送を止め、案内画面を表示する
        document.getElementById("instruction").style.display = "block";
      }
    };
  </script>
</head>
<body style="text-align: center; padding: 40px 20px; font-family: sans-serif;">
  
  <!-- Safariで開いたときに表示される案内画面 -->
  <div id="instruction" style="display: none;">
    <h2>アイコン設定の準備ができました</h2>
    <p>画面下部の <strong>共有ボタン（四角から上向き矢印）</strong> をタップし、<br><strong>「ホーム画面に追加」</strong> を選択してください。</p>
    <br>
    <p style="font-size: 0.9em; color: gray;">※追加したアイコンから起動すると、自動的に大会システムが開きます。</p>
    
    <!-- PCやAndroid等、ブラウザのまま使いたい人用のボタン -->
    <a href="https://script.google.com/macros/s/AKfycbyfbzP4zrii7Nwc4YCbEko7PG5Lf2NgaAgVzvQDMSG-YiRn6DjkxKj6seUwLsQ-siJE/exec" style="display: inline-block; margin-top: 30px; padding: 10px 20px; background: #007bff; color: white; text-decoration: none; border-radius: 5px;">ブラウザのまま開く場合はこちら</a>
  </div>

</body>
</html>
